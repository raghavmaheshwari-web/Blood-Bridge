<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 270' width='800' height='270' font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif'>
  <!-- Background -->
  <rect width='800' height='270' fill='#FFFFFF'/>

  <!-- Box 1: User actions -->
  <rect x='30' y='25' width='150' height='60' rx='3' fill='#FFFFFF' stroke='#000000' stroke-width='1.2'/>
  <text x='105' y='50' font-size='12' font-weight='bold' text-anchor='middle' fill='#000000'>User actions</text>
  <text x='105' y='70' font-size='10' text-anchor='middle' fill='#333333'>clicks, search, inputs</text>

  <!-- Box 2: System / Date checks -->
  <rect x='30' y='110' width='150' height='60' rx='3' fill='#FFFFFF' stroke='#000000' stroke-width='1.2'/>
  <text x='105' y='135' font-size='12' font-weight='bold' text-anchor='middle' fill='#000000'>Eligibility Engine</text>
  <text x='105' y='155' font-size='10' text-anchor='middle' fill='#333333'>90-day cooldown &amp; age</text>

  <!-- Arrows from Left to Center -->
  <line x1='180' y1='55' x2='250' y2='88' stroke='#000000' stroke-width='1.2'/>
  <polygon points='250,88 241,83 243,91' fill='#000000'/>

  <line x1='180' y1='140' x2='250' y2='108' stroke='#000000' stroke-width='1.2'/>
  <polygon points='250,108 243,105 241,113' fill='#000000'/>

  <!-- Center Box: BloodBridge class -->
  <rect x='255' y='55' width='235' height='85' rx='3' fill='#FFFFFF' stroke='#000000' stroke-width='1.5'/>
  <text x='372' y='88' font-size='13' font-weight='bold' text-anchor='middle' fill='#000000'>BloodBridge class</text>
  <text x='372' y='112' font-size='10.5' text-anchor='middle' fill='#333333'>Tkinter window &amp; event handlers</text>

  <!-- Bi-directional Arrow between Center and Right -->
  <line x1='490' y1='97' x2='535' y2='97' stroke='#000000' stroke-width='1.2'/>
  <polygon points='535,97 527,93 527,101' fill='#000000'/>
  <polygon points='490,97 498,93 498,101' fill='#000000'/>

  <!-- Box 3: Data Store -->
  <rect x='540' y='55' width='230' height='85' rx='3' fill='#FFFFFF' stroke='#000000' stroke-width='1.5'/>
  <text x='655' y='88' font-size='13' font-weight='bold' text-anchor='middle' fill='#000000'>InMemoryStore</text>
  <text x='655' y='112' font-size='10.5' text-anchor='middle' fill='#333333'>donors list, ABO/Rh rules, stats</text>

  <!-- Arrow down from Center to Tabs -->
  <line x1='372' y1='140' x2='372' y2='190' stroke='#000000' stroke-width='1.2'/>
  <polygon points='372,190 368,182 376,182' fill='#000000'/>

  <!-- Horizontal Distribution Line -->
  <line x1='120' y1='190' x2='655' y2='190' stroke='#000000' stroke-width='1.2'/>
  <line x1='120' y1='190' x2='120' y2='205' stroke='#000000' stroke-width='1.2'/>
  <polygon points='120,205 116,197 124,197' fill='#000000'/>

  <line x1='372' y1='190' x2='372' y2='205' stroke='#000000' stroke-width='1.2'/>
  <polygon points='372,205 368,197 376,197' fill='#000000'/>

  <line x1='655' y1='190' x2='655' y2='205' stroke='#000000' stroke-width='1.2'/>
  <polygon points='655,205 651,197 659,197' fill='#000000'/>

  <!-- Tab 1 Box -->
  <rect x='30' y='205' width='180' height='48' rx='3' fill='#FFFFFF' stroke='#000000' stroke-width='1.2'/>
  <text x='120' y='225' font-size='11' font-weight='bold' text-anchor='middle' fill='#000000'>Search &amp; Directory</text>
  <text x='120' y='242' font-size='9.5' text-anchor='middle' fill='#444444'>treeview, emergency match</text>

  <!-- Tab 2 Box -->
  <rect x='272' y='205' width='200' height='48' rx='3' fill='#FFFFFF' stroke='#000000' stroke-width='1.2'/>
  <text x='372' y='225' font-size='11' font-weight='bold' text-anchor='middle' fill='#000000'>Donor Registration</text>
  <text x='372' y='242' font-size='9.5' text-anchor='middle' fill='#444444'>form validation, edit mode</text>

  <!-- Tab 3 Box -->
  <rect x='545' y='205' width='220' height='48' rx='3' fill='#FFFFFF' stroke='#000000' stroke-width='1.2'/>
  <text x='655' y='225' font-size='11' font-weight='bold' text-anchor='middle' fill='#000000'>Compatibility Matrix</text>
  <text x='655' y='242' font-size='9.5' text-anchor='middle' fill='#444444'>ABO/Rh guide, pool stats</text>
</svg>