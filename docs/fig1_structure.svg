<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 340' width='720' height='340' font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif'>
  <!-- Background -->
  <rect width='720' height='340' fill='#FFFFFF'/>

  <!-- Left Top: User actions -->
  <rect x='25' y='20' width='150' height='65' rx='4' fill='#FFFFFF' stroke='#000000' stroke-width='1.8'/>
  <text x='100' y='48' font-size='12' font-weight='bold' text-anchor='middle' fill='#000000'>User actions</text>
  <text x='100' y='68' font-size='10' text-anchor='middle' fill='#444444'>clicks and typing</text>

  <!-- Left Bottom: Eligibility / Timers -->
  <rect x='25' y='115' width='150' height='65' rx='4' fill='#FFFFFF' stroke='#000000' stroke-width='1.8'/>
  <text x='100' y='143' font-size='12' font-weight='bold' text-anchor='middle' fill='#000000'>Cooldown Logic</text>
  <text x='100' y='163' font-size='10' text-anchor='middle' fill='#444444'>90-day interval &amp; age</text>

  <!-- Arrow from User Actions to Center -->
  <line x1='175' y1='52' x2='240' y2='85' stroke='#000000' stroke-width='1.5'/>
  <polygon points='240,85 230,80 232,89' fill='#000000'/>

  <!-- Arrow from Cooldown to Center -->
  <line x1='175' y1='148' x2='240' y2='115' stroke='#000000' stroke-width='1.5'/>
  <polygon points='240,115 232,111 230,120' fill='#000000'/>

  <!-- Center Box: BloodBridge class -->
  <rect x='245' y='60' width='230' height='85' rx='4' fill='#FFFFFF' stroke='#000000' stroke-width='2'/>
  <text x='360' y='95' font-size='13' font-weight='bold' text-anchor='middle' fill='#000000'>BloodBridge class</text>
  <text x='360' y='120' font-size='10.5' text-anchor='middle' fill='#444444'>Tkinter window &amp; event handlers</text>

  <!-- Bi-directional Arrow between Center and Right Data Store -->
  <line x1='475' y1='102' x2='530' y2='102' stroke='#000000' stroke-width='1.5'/>
  <polygon points='530,102 521,97 521,107' fill='#000000'/>
  <polygon points='475,102 484,97 484,107' fill='#000000'/>

  <!-- Right Box: InMemoryStore -->
  <rect x='535' y='60' width='160' height='85' rx='4' fill='#FFFFFF' stroke='#000000' stroke-width='2'/>
  <text x='615' y='95' font-size='13' font-weight='bold' text-anchor='middle' fill='#000000'>InMemoryStore</text>
  <text x='615' y='120' font-size='10' text-anchor='middle' fill='#444444'>donors, rules, stats</text>

  <!-- Arrow down from Center to Tabs -->
  <line x1='360' y1='145' x2='360' y2='210' stroke='#000000' stroke-width='1.5'/>
  <polygon points='360,210 355,201 365,201' fill='#000000'/>

  <!-- Horizontal T-distribution Line -->
  <line x1='120' y1='210' x2='600' y2='210' stroke='#000000' stroke-width='1.5'/>

  <!-- Drop down arrow to Tab 1 -->
  <line x1='120' y1='210' x2='120' y2='230' stroke='#000000' stroke-width='1.5'/>
  <polygon points='120,230 115,221 125,221' fill='#000000'/>

  <!-- Drop down arrow to Tab 2 -->
  <line x1='360' y1='210' x2='360' y2='230' stroke='#000000' stroke-width='1.5'/>
  <polygon points='360,230 355,221 365,221' fill='#000000'/>

  <!-- Drop down arrow to Tab 3 -->
  <line x1='600' y1='210' x2='600' y2='230' stroke='#000000' stroke-width='1.5'/>
  <polygon points='600,230 595,221 605,221' fill='#000000'/>

  <!-- Bottom Row: 3 Tab Boxes -->
  <!-- Tab 1: Search & Directory -->
  <rect x='25' y='230' width='190' height='75' rx='4' fill='#FFFFFF' stroke='#000000' stroke-width='1.8'/>
  <text x='120' y='260' font-size='12.5' font-weight='bold' text-anchor='middle' fill='#000000'>Search &amp; Directory</text>
  <text x='120' y='282' font-size='10' text-anchor='middle' fill='#444444'>treeview, emergency match</text>

  <!-- Tab 2: Donor Registration -->
  <rect x='265' y='230' width='190' height='75' rx='4' fill='#FFFFFF' stroke='#000000' stroke-width='1.8'/>
  <text x='360' y='260' font-size='12.5' font-weight='bold' text-anchor='middle' fill='#000000'>Donor Registration</text>
  <text x='360' y='282' font-size='10' text-anchor='middle' fill='#444444'>validation, edit mode</text>

  <!-- Tab 3: Compatibility Matrix -->
  <rect x='505' y='230' width='190' height='75' rx='4' fill='#FFFFFF' stroke='#000000' stroke-width='1.8'/>
  <text x='600' y='260' font-size='12.5' font-weight='bold' text-anchor='middle' fill='#000000'>Compatibility Matrix</text>
  <text x='600' y='282' font-size='10' text-anchor='middle' fill='#444444'>ABO/Rh rules, pool stats</text>
</svg>