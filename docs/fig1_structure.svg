<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 360' width='800' height='360' font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif'>
  <!-- Background -->
  <rect width='800' height='360' fill='#FFFFFF'/>

  <!-- Left Top: User actions -->
  <rect x='30' y='25' width='160' height='70' rx='4' fill='#FFFFFF' stroke='#000000' stroke-width='1.5'/>
  <text x='110' y='55' font-size='13' font-weight='bold' text-anchor='middle' fill='#000000'>User actions</text>
  <text x='110' y='76' font-size='11' text-anchor='middle' fill='#444444'>clicks and typing</text>

  <!-- Left Bottom: Eligibility / Timers -->
  <rect x='30' y='125' width='160' height='70' rx='4' fill='#FFFFFF' stroke='#000000' stroke-width='1.5'/>
  <text x='110' y='155' font-size='13' font-weight='bold' text-anchor='middle' fill='#000000'>Cooldown Logic</text>
  <text x='110' y='176' font-size='11' text-anchor='middle' fill='#444444'>90-day interval &amp; age</text>

  <!-- Arrow from User Actions to Center -->
  <line x1='190' y1='60' x2='265' y2='95' stroke='#000000' stroke-width='1.4'/>
  <polygon points='265,95 255,90 257,99' fill='#000000'/>

  <!-- Arrow from Cooldown to Center -->
  <line x1='190' y1='160' x2='265' y2='125' stroke='#000000' stroke-width='1.4'/>
  <polygon points='265,125 257,121 255,130' fill='#000000'/>

  <!-- Center Box: BloodBridge class -->
  <rect x='270' y='65' width='245' height='90' rx='4' fill='#FFFFFF' stroke='#000000' stroke-width='1.8'/>
  <text x='392' y='102' font-size='14' font-weight='bold' text-anchor='middle' fill='#000000'>BloodBridge class</text>
  <text x='392' y='128' font-size='11.5' text-anchor='middle' fill='#444444'>Tkinter window and event handlers</text>

  <!-- Bi-directional Arrow between Center and Right Data Store -->
  <line x1='515' y1='110' x2='555' y2='110' stroke='#000000' stroke-width='1.4'/>
  <polygon points='555,110 546,105 546,115' fill='#000000'/>
  <polygon points='515,110 524,105 524,115' fill='#000000'/>

  <!-- Right Box: InMemoryStore -->
  <rect x='560' y='65' width='210' height='90' rx='4' fill='#FFFFFF' stroke='#000000' stroke-width='1.8'/>
  <text x='665' y='102' font-size='14' font-weight='bold' text-anchor='middle' fill='#000000'>InMemoryStore</text>
  <text x='665' y='128' font-size='11.5' text-anchor='middle' fill='#444444'>donors, compatibility, stats</text>

  <!-- Arrow down from Center to Tabs -->
  <line x1='392' y1='155' x2='392' y2='225' stroke='#000000' stroke-width='1.4'/>
  <polygon points='392,225 387,216 397,216' fill='#000000'/>

  <!-- Horizontal T-distribution Line -->
  <line x1='120' y1='225' x2='665' y2='225' stroke='#000000' stroke-width='1.4'/>

  <!-- Drop down arrow to Tab 1 -->
  <line x1='120' y1='225' x2='120' y2='245' stroke='#000000' stroke-width='1.4'/>
  <polygon points='120,245 115,236 125,236' fill='#000000'/>

  <!-- Drop down arrow to Tab 2 -->
  <line x1='392' y1='225' x2='392' y2='245' stroke='#000000' stroke-width='1.4'/>
  <polygon points='392,245 387,236 397,236' fill='#000000'/>

  <!-- Drop down arrow to Tab 3 -->
  <line x1='665' y1='225' x2='665' y2='245' stroke='#000000' stroke-width='1.4'/>
  <polygon points='665,245 660,236 670,236' fill='#000000'/>

  <!-- Bottom Row: 3 Tab Boxes -->
  <!-- Tab 1: Search & Directory -->
  <rect x='25' y='245' width='190' height='75' rx='4' fill='#FFFFFF' stroke='#000000' stroke-width='1.5'/>
  <text x='120' y='275' font-size='13' font-weight='bold' text-anchor='middle' fill='#000000'>Search &amp; Directory</text>
  <text x='120' y='298' font-size='11' text-anchor='middle' fill='#444444'>treeview, emergency match</text>

  <!-- Tab 2: Donor Registration -->
  <rect x='285' y='245' width='215' height='75' rx='4' fill='#FFFFFF' stroke='#000000' stroke-width='1.5'/>
  <text x='392' y='275' font-size='13' font-weight='bold' text-anchor='middle' fill='#000000'>Donor Registration</text>
  <text x='392' y='298' font-size='11' text-anchor='middle' fill='#444444'>validation, edit mode</text>

  <!-- Tab 3: Compatibility Matrix -->
  <rect x='555' y='245' width='220' height='75' rx='4' fill='#FFFFFF' stroke='#000000' stroke-width='1.5'/>
  <text x='665' y='275' font-size='13' font-weight='bold' text-anchor='middle' fill='#000000'>Compatibility Matrix</text>
  <text x='665' y='298' font-size='11' text-anchor='middle' fill='#444444'>ABO/Rh rules, pool stats</text>
</svg>