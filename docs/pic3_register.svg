<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 580' width='900' height='580' font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif'>
  <rect width='900' height='580' rx='6' fill='#F5F7FA'/>
  <rect width='900' height='26' rx='6' fill='#E2E8F0'/>
  <circle cx='16' cy='13' r='4.5' fill='#FF5F56'/>
  <circle cx='32' cy='13' r='4.5' fill='#FFBD2E'/>
  <circle cx='48' cy='13' r='4.5' fill='#27C93F'/>
  <text x='450' y='17' font-size='10' fill='#475569' text-anchor='middle' font-weight='600'>Blood Donor Registration and Search System - Register Tab</text>
  
  <rect y='26' width='900' height='48' fill='#C62828'/>
  <text x='20' y='52' font-size='16' font-weight='bold' fill='#FFFFFF'>🩸 Voluntary Blood Donor Registration Portal</text>
  <text x='20' y='66' font-size='9' fill='#FFCDD2'>Form validation conforms to National Blood Transfusion Standards (Age 18-65, Wt ≥ 50kg)</text>

  <!-- Tabs (Tab 2 Active) -->
  <rect x='10' y='80' width='880' height='28' fill='#E2E8F0' rx='3'/>
  <text x='80' y='98' font-size='10' font-weight='bold' fill='#475569' text-anchor='middle'>🔍 Search &amp; Directory</text>
  <rect x='160' y='80' width='150' height='28' fill='#C62828' rx='3'/>
  <text x='235' y='98' font-size='10' font-weight='bold' fill='#FFFFFF' text-anchor='middle'>📝 Donor Registration</text>
  <text x='395' y='98' font-size='10' font-weight='bold' fill='#475569' text-anchor='middle'>📊 Compatibility Matrix</text>

  <!-- Form Card -->
  <rect x='10' y='116' width='880' height='450' rx='4' fill='#FFFFFF' stroke='#CFD8DC'/>
  <rect x='11' y='117' width='878' height='28' fill='#E8F5E9'/>
  <text x='25' y='135' font-size='11' font-weight='bold' fill='#2E7D32'>➕ Register New Voluntary Blood Donor</text>

  <!-- Left Column -->
  <text x='30' y='165' font-size='9.5' font-weight='bold' fill='#334155'>Full Name *</text>
  <rect x='30' y='172' width='380' height='26' rx='3' fill='#FFFFFF' stroke='#94A3B8'/>
  <text x='40' y='189' font-size='9' fill='#1E293B'>Raghav Maheshwari</text>

  <text x='30' y='216' font-size='9.5' font-weight='bold' fill='#334155'>Age (18-65) *</text>
  <rect x='30' y='223' width='180' height='26' rx='3' fill='#FFFFFF' stroke='#94A3B8'/>
  <text x='40' y='240' font-size='9' fill='#1E293B'>20</text>

  <text x='230' y='216' font-size='9.5' font-weight='bold' fill='#334155'>Gender *</text>
  <rect x='230' y='223' width='180' height='26' rx='3' fill='#FFFFFF' stroke='#94A3B8'/>
  <text x='240' y='240' font-size='9' fill='#1E293B'>Male ▼</text>

  <text x='30' y='268' font-size='9.5' font-weight='bold' fill='#334155'>Blood Group *</text>
  <rect x='30' y='275' width='180' height='26' rx='3' fill='#FFFFFF' stroke='#94A3B8'/>
  <text x='40' y='292' font-size='9' font-weight='bold' fill='#C62828'>O+ ▼</text>

  <text x='230' y='268' font-size='9.5' font-weight='bold' fill='#334155'>Weight (kg) (Min 50)</text>
  <rect x='230' y='275' width='180' height='26' rx='3' fill='#FFFFFF' stroke='#94A3B8'/>
  <text x='240' y='292' font-size='9' fill='#1E293B'>68.0</text>

  <text x='30' y='320' font-size='9.5' font-weight='bold' fill='#334155'>Contact Phone Number *</text>
  <rect x='30' y='327' width='380' height='26' rx='3' fill='#FFFFFF' stroke='#94A3B8'/>
  <text x='40' y='344' font-size='9' fill='#1E293B'>+91 98765 43210</text>

  <text x='30' y='372' font-size='9.5' font-weight='bold' fill='#334155'>Email Address</text>
  <rect x='30' y='379' width='380' height='26' rx='3' fill='#FFFFFF' stroke='#94A3B8'/>
  <text x='40' y='396' font-size='9' fill='#1E293B'>raghav.m@example.com</text>

  <!-- Right Column -->
  <text x='460' y='165' font-size='9.5' font-weight='bold' fill='#334155'>City / District *</text>
  <rect x='460' y='172' width='400' height='26' rx='3' fill='#FFFFFF' stroke='#94A3B8'/>
  <text x='470' y='189' font-size='9' fill='#1E293B'>Chennai / Chengalpattu</text>

  <text x='460' y='216' font-size='9.5' font-weight='bold' fill='#334155'>Street Address / Locality</text>
  <rect x='460' y='223' width='400' height='26' rx='3' fill='#FFFFFF' stroke='#94A3B8'/>
  <text x='470' y='240' font-size='9' fill='#1E293B'>SRM Nagar, Potheri, Kattankulathur</text>

  <text x='460' y='268' font-size='9.5' font-weight='bold' fill='#334155'>Last Donation Date (YYYY-MM-DD)</text>
  <rect x='460' y='275' width='220' height='26' rx='3' fill='#F1F5F9' stroke='#94A3B8'/>
  <text x='470' y='292' font-size='9' fill='#94A3B8'>[Disabled - First Time]</text>
  <rect x='690' y='280' width='12' height='12' fill='#2E7D32' rx='2'/>
  <text x='710' y='291' font-size='8.5' fill='#334155'>First Time / Never Donated</text>

  <text x='460' y='320' font-size='9.5' font-weight='bold' fill='#334155'>Availability</text>
  <rect x='460' y='330' width='12' height='12' fill='#2E7D32' rx='2'/>
  <text x='480' y='341' font-size='9' font-weight='bold' fill='#2E7D32'>Available for Emergency Donation Calls</text>

  <text x='460' y='372' font-size='9.5' font-weight='bold' fill='#334155'>Medical Remarks / Health Notes</text>
  <rect x='460' y='379' width='400' height='46' rx='3' fill='#FFFFFF' stroke='#94A3B8'/>
  <text x='470' y='396' font-size='8.5' fill='#64748B'>Regular voluntary donor, non-smoker, hemoglobin verified</text>

  <!-- Submit Buttons -->
  <rect x='30' y='460' width='180' height='34' rx='4' fill='#2E7D32'/>
  <text x='120' y='482' font-size='10' font-weight='bold' fill='#FFFFFF' text-anchor='middle'>💾 Save &amp; Register Donor</text>

  <rect x='225' y='460' width='130' height='34' rx='4' fill='#607D8B'/>
  <text x='290' y='482' font-size='10' font-weight='bold' fill='#FFFFFF' text-anchor='middle'>🧹 Clear Form</text>

  <rect x='520' y='460' width='340' height='34' rx='4' fill='#E8F5E9' stroke='#A5D6A7'/>
  <text x='690' y='482' font-size='9' font-weight='bold' fill='#2E7D32' text-anchor='middle'>✓ Ready for Registration - Validation Passed</text>
</svg>