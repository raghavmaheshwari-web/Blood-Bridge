  <!-- Matrix Table -->
  <rect x='10' y='194' width='880' height='340' rx='4' fill='#FFFFFF' stroke='#CFD8DC'/>
  <rect x='11' y='195' width='878' height='24' fill='#37474F'/>
  <text x='25' y='211' font-size='9.5' font-weight='bold' fill='#FFFFFF'>Blood Type   Can Give Blood To (Recipients)       Can Receive Blood From (Donors)    Significance</text>

  <rect x='11' y='220' width='878' height='24' fill='#ECEFF1'/>
  <text x='25' y='236' font-size='9' font-weight='bold' fill='#C62828'>🩸 O-</text>
  <text x='115' y='236' font-size='9' fill='#1E293B'>O-, O+, A-, A+, B-, B+, AB-, AB+</text>
  <text x='380' y='236' font-size='9' fill='#1E293B'>O-</text>
  <text x='580' y='236' font-size='8.5' fill='#475569'>🌟 Universal Red Cell Donor (Gives to all 8 types)</text>

  <rect x='11' y='245' width='878' height='24' fill='#FFFFFF'/>
  <text x='25' y='261' font-size='9' font-weight='bold' fill='#C62828'>🩸 O+</text>
  <text x='115' y='261' font-size='9' fill='#1E293B'>O+, A+, B+, AB+</text>
  <text x='380' y='261' font-size='9' fill='#1E293B'>O+, O-</text>
  <text x='580' y='261' font-size='8.5' fill='#475569'>Most common blood group (~38% of population)</text>

  <rect x='11' y='270' width='878' height='24' fill='#ECEFF1'/>
  <text x='25' y='286' font-size='9' font-weight='bold' fill='#C62828'>🩸 A-</text>
  <text x='115' y='286' font-size='9' fill='#1E293B'>A-, A+, AB-, AB+</text>
  <text x='380' y='286' font-size='9' fill='#1E293B'>A-, O-</text>
  <text x='580' y='286' font-size='8.5' fill='#475569'>Compatible donor for all A and AB recipients</text>

  <rect x='11' y='295' width='878' height='24' fill='#FFFFFF'/>
  <text x='25' y='311' font-size='9' font-weight='bold' fill='#C62828'>🩸 A+</text>
  <text x='115' y='311' font-size='9' fill='#1E293B'>A+, AB+</text>
  <text x='380' y='311' font-size='9' fill='#1E293B'>A+, A-, O+, O-</text>
  <text x='580' y='311' font-size='8.5' fill='#475569'>Second most frequent blood type</text>

  <rect x='11' y='320' width='878' height='24' fill='#ECEFF1'/>
  <text x='25' y='336' font-size='9' font-weight='bold' fill='#C62828'>🩸 B-</text>
  <text x='115' y='336' font-size='9' fill='#1E293B'>B-, B+, AB-, AB+</text>
  <text x='380' y='336' font-size='9' fill='#1E293B'>B-, O-</text>
  <text x='580' y='336' font-size='8.5' fill='#475569'>Rare Rh-negative blood type</text>

  <rect x='11' y='345' width='878' height='24' fill='#FFFFFF'/>
  <text x='25' y='361' font-size='9' font-weight='bold' fill='#C62828'>🩸 B+</text>
  <text x='115' y='361' font-size='9' fill='#1E293B'>B+, AB+</text>
  <text x='380' y='361' font-size='9' fill='#1E293B'>B+, B-, O+, O-</text>
  <text x='580' y='361' font-size='8.5' fill='#475569'>Very common in Indian subcontinent (~32%)</text>

  <rect x='11' y='370' width='878' height='24' fill='#ECEFF1'/>
  <text x='25' y='386' font-size='9' font-weight='bold' fill='#C62828'>🩸 AB-</text>
  <text x='115' y='386' font-size='9' fill='#1E293B'>AB-, AB+</text>
  <text x='380' y='386' font-size='9' fill='#1E293B'>AB-, A-, B-, O-</text>
  <text x='580' y='386' font-size='8.5' fill='#475569'>Universal platelet donor, rare whole blood</text>

  <rect x='11' y='395' width='878' height='24' fill='#FFFFFF'/>
  <text x='25' y='411' font-size='9' font-weight='bold' fill='#C62828'>🩸 AB+</text>
  <text x='115' y='411' font-size='9' fill='#1E293B'>AB+</text>
  <text x='380' y='411' font-size='9' fill='#1E293B'>AB+, AB-, A+, A-, B+, B-, O+, O-</text>
  <text x='580' y='411' font-size='8.5' fill='#475569'>🌟 Universal Red Cell Recipient (Can receive from all)</text>

  <rect x='11' y='425' width='878' height='30' fill='#FFF8E1'/>
  <text x='25' y='444' font-size='9' font-weight='bold' fill='#B45309'>📌 Guidelines: Age 18–65 • Weight ≥ 50kg • Minimum 90 days interval between whole blood donations</text>

